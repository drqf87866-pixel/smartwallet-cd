name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typcheck
        run: npm run typecheck

      - name: Tailwind-CSS bauen
        run: npm run build:css

      - name: Tests (Vitest + workerd mit D1)
        run: npm test

      - name: Deploy-Trockenlauf (fängt Build-Brüche vor dem echten Deploy ab)
        run: npx wrangler deploy --dry-run
